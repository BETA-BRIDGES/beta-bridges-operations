name: Google Sheet Import and Reconciliation

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: google-sheet-bidirectional-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production deployment after a push
        if: github.event_name == 'push'
        run: sleep 120

      - name: Run controlled six-module bidirectional sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          response=$(curl --retry 6 --retry-delay 10 --retry-all-errors -sS -w "\\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://beta-bridges-operations.vercel.app/api/cron/google-sync")
          status=$(printf '%s\\n' "$response" | tail -n1)
          body=$(printf '%s\\n' "$response" | sed '$d')
          printf '%s\\n' "$body" | jq .
          if [ "$status" -ge 300 ]; then
            echo "Bidirectional Google sync endpoint returned HTTP $status"
            exit 1
          fi
          if ! printf '%s\\n' "$body" | jq -e '.ok == true' >/dev/null; then
            echo "One or more Google Sheets modules failed synchronization."
            exit 1
          fi
