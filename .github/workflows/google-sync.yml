name: Legacy Google Sheet to Platform Import

# Temporarily manual-only while the Supabase database is recovering.
# Re-enable schedule and push triggers only after SQL health checks pass.

on:
  workflow_dispatch:

concurrency:
  group: legacy-sheet-to-platform-import-v1
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Import legacy Google Sheet into platform (no Sheet writes)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          modules=(clientData dailyJobListing dailyJobDone usedStock miscellaneousCharges techieWeeklyActivity)
          failed=0
          for module in "${modules[@]}"; do
            echo "Starting sheet-to-platform import for ${module}"
            if ! response=$(curl --connect-timeout 15 --max-time 240 -sS -w '\n%{http_code}' \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://beta-bridges-operations.vercel.app/api/cron/google-sync?mode=import&module=${module}"); then
              echo "Request failed or timed out for ${module}; continuing to next module."
              failed=1
              continue
            fi
            status=$(printf '%s\n' "$response" | tail -n1)
            body=$(printf '%s\n' "$response" | sed '$d')
            printf '%s\n' "$body" | jq . || true
            if [ "$status" -ge 300 ] || ! printf '%s\n' "$body" | jq -e --arg module "$module" '.ok == true and .results[$module].ok == true' >/dev/null; then
              echo "Sheet-to-platform import failed for ${module} (HTTP $status); continuing."
              failed=1
              continue
            fi
            echo "Verified import success for ${module}"
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more imports failed. No platform-to-Sheet export was attempted."
            exit 1
          fi
          echo "All six legacy Sheet imports passed API-level checks. No Sheet writes were performed."
