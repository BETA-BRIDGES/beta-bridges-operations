name: Google Sheet Import

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - clientData
          - dailyJobListing
          - dailyJobDone
          - usedStock
          - miscellaneousCharges
          - techieWeeklyActivity
    concurrency:
      group: google-sheet-import-${{ matrix.module }}
      cancel-in-progress: false
    steps:
      - name: Import ${{ matrix.module }} into platform
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MODULE: ${{ matrix.module }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "Waiting for the production deployment to become available..."
            sleep 90
          fi
          response=$(curl --retry 6 --retry-delay 10 --retry-all-errors -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://beta-bridges-operations.vercel.app/api/cron/google-sync?module=$MODULE")
          status=$(printf '%s\n' "$response" | tail -n1)
          body=$(printf '%s\n' "$response" | sed '$d')
          echo "$body"
          if [ "$status" -ge 300 ]; then
            echo "Google Sheet import endpoint returned HTTP $status"
            exit 1
          fi
