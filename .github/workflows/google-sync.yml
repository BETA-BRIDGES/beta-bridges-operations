name: Google Sheet Import

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: google-sheet-import
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Import Google Sheets into platform
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Waiting briefly for the production deployment to become available..."
          sleep 90
          response=$(curl --retry 6 --retry-delay 10 --retry-all-errors -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://beta-bridges-operations.vercel.app/api/cron/google-sync")
          status=$(printf '%s\n' "$response" | tail -n1)
          body=$(printf '%s\n' "$response" | sed '$d')
          echo "$body"
          if [ "$status" -ge 300 ]; then
            echo "Google Sheet import endpoint returned HTTP $status"
            exit 1
          fi
