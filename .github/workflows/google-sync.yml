name: Google Sheet Import and Reconciliation

on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: google-sheet-bidirectional-sync-v3
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production deployment after a push
        if: github.event_name == 'push'
        run: sleep 180

      - name: Run controlled six-module bidirectional sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          modules=(clientData dailyJobListing dailyJobDone usedStock miscellaneousCharges techieWeeklyActivity)
          failed=0
          for module in "${modules[@]}"; do
            echo "Starting isolated bidirectional sync for ${module}"
            if ! response=$(curl --connect-timeout 15 --max-time 240 -sS -w '\n%{http_code}' \
              -H "Authorization: Bearer $CRON_SECRET" \
              "https://beta-bridges-operations.vercel.app/api/cron/google-sync?mode=bidirectional&module=${module}"); then
              echo "Request failed or timed out for ${module}; continuing to next module."
              failed=1
              continue
            fi
            status=$(printf '%s\n' "$response" | tail -n1)
            body=$(printf '%s\n' "$response" | sed '$d')
            printf '%s\n' "$body" | jq . || true
            if [ "$status" -ge 300 ] || ! printf '%s\n' "$body" | jq -e --arg module "$module" '.ok == true and .results[$module].ok == true' >/dev/null; then
              echo "Bidirectional sync failed for ${module} (HTTP $status); continuing."
              failed=1
              continue
            fi
            echo "Verified API success for ${module}"
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more modules failed. Database verification is still required."
            exit 1
          fi
          echo "All six modules passed API-level synchronization checks."
