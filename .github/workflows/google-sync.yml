name: Google Sheets Sync
# one-time execution after production reconciliation deployment

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Google Sheets sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://beta-bridges-operations.vercel.app/api/cron/google-sync?force=sheet_to_platform")
          status=$(printf '%s\n' "$response" | tail -n1)
          body=$(printf '%s\n' "$response" | sed '$d')
          echo "$body"
          if [ "$status" -ge 300 ]; then
            echo "Sync endpoint returned HTTP $status"
            exit 1
          fi
