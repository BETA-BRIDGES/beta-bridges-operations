name: Platform to Google Sheet Export

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export platform changes to Google Sheets
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://beta-bridges-operations.vercel.app/api/cron/google-platform-export")
          status=$(printf '%s\n' "$response" | tail -n1)
          body=$(printf '%s\n' "$response" | sed '$d')
          echo "$body"
          if [ "$status" -ge 300 ]; then
            echo "Platform export endpoint returned HTTP $status"
            exit 1
          fi
