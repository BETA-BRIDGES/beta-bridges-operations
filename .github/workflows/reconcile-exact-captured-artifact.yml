name: Final Read-Only Reconciliation Of Captured Artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for production deployment
        run: sleep 120

      - name: Download exact captured artifact
        uses: actions/download-artifact@v5
        with:
          name: live-google-legacy-snapshots-b0037448e759ea97bc4c212881f3bfca3695e76b
          run-id: 37323197041
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: live-snapshots

      - name: Run read-only six-module reconciliation
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p reports
          base="https://beta-bridges-operations.vercel.app/api/cron/google-reconcile?dryRun=1"
          for module in clientData dailyJobListing dailyJobDone usedStock miscellaneousCharges techieWeeklyActivity; do
            echo "Reconciling $module..."
            curl --retry 10 --retry-delay 10 --retry-all-errors -fsS               -H "Authorization: Bearer $CRON_SECRET"               -F "module=$module"               -F "source_run_id=37323197041"               -F "source_commit_sha=b0037448e759ea97bc4c212881f3bfca3695e76b"               -F "file=@live-snapshots/$module-live-legacy.xlsx"               "$base" > "reports/$module.json"
            jq '.summary' "reports/$module.json"
          done

      - name: Build consolidated reconciliation report
        run: |
          jq -s '{source_artifact:{workflow_run_id:37323197041,artifact_id:11350773239,commit_sha:"b0037448e759ea97bc4c212881f3bfca3695e76b"},modules: map({module,summary,diffs})}' reports/*.json > reports/final-reconciliation.json
          jq '{source_artifact,modules: [.modules[] | {module,summary}]}' reports/final-reconciliation.json

      - name: Upload final reconciliation report
        uses: actions/upload-artifact@v4
        with:
          name: final-reconciliation-b0037448
          path: reports/final-reconciliation.json
          retention-days: 7

      - name: Commit final report to repository
        uses: actions/github-script@v8
        env:
          REPORT_PATH: reports/final-reconciliation.json
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const path = "reports/final-reconciliation-b0037448.json";
            const content = fs.readFileSync(process.env.REPORT_PATH);
            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: "main"
              });
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: "main",
              message: "chore: save final captured-artifact reconciliation [skip ci]",
              content: content.toString("base64"),
              ...(sha ? {sha} : {})
            });
