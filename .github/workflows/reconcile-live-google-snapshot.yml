name: Reconcile Captured Google Snapshot

on:
  workflow_run:
    workflows: ["Live Google Legacy Snapshots"]
    types: [completed]

jobs:
  reconcile:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download captured snapshot artifact
        uses: actions/download-artifact@v5
        with:
          name: live-google-legacy-snapshots-${{ github.event.workflow_run.head_sha }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: live-snapshots

      - name: Reconcile captured records against platform
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          base="https://beta-bridges-operations.vercel.app/api/cron/google-reconcile"
          run_id=""
          for module in clientData dailyJobListing dailyJobDone usedStock miscellaneousCharges techieWeeklyActivity; do
            echo "Reconciling $module..."
            response=$(curl --retry 8 --retry-delay 10 --retry-all-errors -fsS               -H "Authorization: Bearer $CRON_SECRET"               -F "module=$module"               -F "source_run_id=$SOURCE_RUN_ID"               -F "source_commit_sha=$SOURCE_COMMIT_SHA"               ${run_id:+-F "run_id=$run_id"}               -F "file=@live-snapshots/$module-live-legacy.xlsx"               "$base")
            echo "$response"
            if [ -z "$run_id" ]; then
              run_id=$(printf '%s' "$response" | jq -r '.run_id')
              test -n "$run_id" && test "$run_id" != "null"
            fi
          done
          echo "RECONCILIATION_RUN_ID=$run_id" >> "$GITHUB_STEP_SUMMARY"
